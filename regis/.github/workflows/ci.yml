name: CI

on:
  push:
    branches: [ main, testing ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: regis
          POSTGRES_PASSWORD: regis
          POSTGRES_DB: regis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regis" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd regis/backend
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Backend lint (ruff + black + isort)
        run: |
          cd regis/backend
          ruff check .
          black --check .
          isort --check-only .
      - name: Backend type checks (mypy)
        run: |
          cd regis/backend
          python -m mypy app || true
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do pg_isready -h localhost -p 5432 -U regis && break || sleep 1; done
      - name: Create test role and DB
        run: |
          docker run --network host --rm postgres:16 psql -h localhost -U regis -c "CREATE ROLE regis_app WITH LOGIN PASSWORD 'regis_app_pw'" || true
          docker run --network host --rm postgres:16 psql -h localhost -U regis -c "CREATE DATABASE regis_test OWNER regis_app" || true
      - name: Apply alembic migrations
        run: |
          cd regis/backend
          python -c "from alembic.config import Config; from alembic import command; cfg=Config('alembic.ini'); cfg.set_main_option('sqlalchemy.url','postgresql+psycopg://regis_app:regis_app_pw@localhost:5432/regis_test'); command.upgrade(cfg,'head')"
      - name: Frontend build & typecheck
        run: |
          cd regis/frontend
          npm ci
          npm run build
      - name: Run tests
        env:
          REGIS_TEST_PG_URL: postgresql+psycopg://regis_app:regis_app_pw@localhost:5432/regis_test
        run: |
          cd regis/backend
          pytest -q
