# Local dev stack. Mirrors the PRD architecture: Postgres + Redis + S3(MinIO) +
# Qdrant + the FastAPI API and the Arq worker. Production runs the managed
# equivalents (RDS, ElastiCache, S3, Qdrant) in AWS ap-south-1 — see infra/terraform.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: regis
      POSTGRES_PASSWORD: regis
      POSTGRES_DB: regis
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regis"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Use the official image entrypoint; one-shot init happens via a
    # separate `postgres-init` service that depends on the DB being healthy.

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio: # S3-compatible storage for evidence documents (local stand-in for S3)
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: regis
      MINIO_ROOT_PASSWORD: regis-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  qdrant: # vector DB for the copilot RAG corpus + per-tenant doc namespace
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]

  # One-shot init helper: creates a non-superuser role and a test DB after
  # the main postgres service reports healthy. Keeps the postgres service
  # configuration simple and avoids backgrounding the server process.
  postgres-init:
    image: postgres:16
    depends_on:
      postgres: {condition: service_healthy}
    command: >
      sh -c "set -e; until pg_isready -h postgres -U regis; do sleep 1; done; \
      printf \"CREATE ROLE regis_app WITH LOGIN PASSWORD 'regis_app_pw';\\nCREATE DATABASE regis_test OWNER regis_app;\\n\" | PGPASSWORD=regis psql -h postgres -U regis -d regis || true; \
      echo 'postgres-init: done'"
    restart: 'no'

  api:
    build: ./backend
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    environment:
      REGIS_DATABASE_URL: postgresql+psycopg://regis:regis@postgres:5432/regis
      REGIS_REDIS_URL: redis://redis:6379/0
      REGIS_QDRANT_URL: http://qdrant:6333
      REGIS_JWT_SECRET: dev-only-change-me
    ports: ["8000:8000"]
    # On boot: apply migrations, seed the library, then serve.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed.cli &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    environment:
      REGIS_DATABASE_URL: postgresql+psycopg://regis:regis@postgres:5432/regis
      REGIS_REDIS_URL: redis://redis:6379/0
    command: ["arq", "app.jobs.worker.WorkerSettings"]

  # Optional helper to run demo script inside the backend container
  demo:
    build: ./backend
    depends_on:
      - postgres
      - redis
    entrypoint: ["/bin/sh","-c","/app/scripts/demo.sh"]

volumes:
  pgdata:
  miniodata:
  qdrantdata:
